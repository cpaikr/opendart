name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    with:
      expected_sha: ${{ github.sha }}

  release-please:
    needs: verify
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    outputs:
      prs: ${{ steps.proposals.outputs.numbers }}
      sdk_release_created: ${{ steps.component.outputs.sdk_release_created }}
      sdk_tag_name: ${{ steps.component.outputs.sdk_tag_name }}
      sdk_version: ${{ steps.component.outputs.sdk_version }}
      sdk_sha: ${{ steps.component.outputs.sdk_sha }}
      sdk_prerelease: ${{ steps.component.outputs.sdk_prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Detect interrupted component release
        id: recovery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          releases="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          candidates="$(mktemp)"

          probe_tag_ref() {
            tag="$1"
            response="$(mktemp)"
            error="$(mktemp)"
            if gh api --include "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" > "${response}" 2> "${error}"; then
              rm -f "${response}" "${error}"
              printf '%s\n' exists
              return
            else
              api_status=$?
            fi
            http_status="$(sed -n 's/^HTTP\/[^ ]* \([0-9][0-9][0-9]\).*/\1/p' "${response}" | tail -n 1)"
            if test "${http_status}" = 404; then
              rm -f "${response}" "${error}"
              printf '%s\n' absent
              return
            fi
            cat "${error}" >&2
            rm -f "${response}" "${error}"
            echo "unable to verify tag ref ${tag}; GitHub API status ${http_status:-unknown}" >&2
            return "${api_status}"
          }

          inspect_component() {
            component="$1"
            manifest_path="$2"
            tag_prefix="$3"
            version="$(jq -r --arg path "${manifest_path}" '.[$path] // empty' .release-please-manifest.json)"
            if test -z "${version}"; then
              return
            fi
            expected_prerelease=false
            if test "${component}" = sdk; then
              if grep -Eq '^0\.1\.0-beta\.[1-9][0-9]*$' <<<"${version}"; then
                expected_prerelease=true
              elif test "${version}" != 0.1.0; then
                echo "unsupported SDK release version: ${version}" >&2
                exit 1
              fi
            fi
            tag_name="${tag_prefix}${version}"
            matches="$(jq -c --arg tag "${tag_name}" '[.[][] | select(.tag_name == $tag)]' <<<"${releases}")"
            match_count="$(jq 'length' <<<"${matches}")"
            if test "${match_count}" -gt 1; then
              echo "multiple GitHub releases match ${tag_name}" >&2
              exit 1
            fi
            if test "${match_count}" = 0; then
              tag_ref_status="$(probe_tag_ref "${tag_name}")"
              if test "${tag_ref_status}" = exists; then
                echo "tag exists without a matching GitHub release: ${tag_name}" >&2
                exit 1
              fi
              return
            fi

            release="$(jq -c '.[0]' <<<"${matches}")"
            is_draft="$(jq -r .draft <<<"${release}")"
            is_prerelease="$(jq -r .prerelease <<<"${release}")"
            target="$(jq -r .target_commitish <<<"${release}")"
            if test "${component}" = sdk && test "${version}" = 0.1.0-beta.1; then
              if test "${is_draft}" != true || test "${is_prerelease}" != true || test "${target}" != 157d78aa62bace4b00df6677bc3372baf88b9281; then
                echo "superseded SDK candidate state mismatch for ${tag_name}" >&2
                exit 1
              fi
              tag_ref_status="$(probe_tag_ref "${tag_name}")"
              if test "${tag_ref_status}" = exists; then
                echo "superseded SDK candidate unexpectedly has a tag: ${tag_name}" >&2
                exit 1
              fi
              return
            fi
            if test "${is_prerelease}" != "${expected_prerelease}"; then
              echo "prerelease state mismatch for ${tag_name}" >&2
              exit 1
            fi
            if test "${is_draft}" = true; then
              grep -Eq '^[0-9a-f]{40}$' <<<"${target}"
              git merge-base --is-ancestor "${target}" "${GITHUB_SHA}"
              if test "${component}" = sdk; then
                tag_ref_status="$(probe_tag_ref "${tag_name}")"
                if test "${tag_ref_status}" = exists; then
                  echo "SDK draft unexpectedly has a tag: ${tag_name}" >&2
                  exit 1
                fi
              fi
              jq -n --arg component "${component}" --arg tag "${tag_name}" --arg version "${version}" --arg sha "${target}" --argjson prerelease "${expected_prerelease}" \
                '{state: "draft", component: $component, tag: $tag, version: $version, sha: $sha, prerelease: $prerelease}' >> "${candidates}"
              return
            fi

            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag_name}" --jq .sha)"
            grep -Eq '^[0-9a-f]{40}$' <<<"${tag_sha}"
            if test "${tag_sha}" = "${GITHUB_SHA}"; then
              jq -n --arg component "${component}" --arg tag "${tag_name}" --arg version "${version}" --arg sha "${tag_sha}" --argjson prerelease "${expected_prerelease}" \
                '{state: "complete", component: $component, tag: $tag, version: $version, sha: $sha, prerelease: $prerelease}' >> "${candidates}"
              return
            fi
            if ! git merge-base --is-ancestor "${tag_sha}" "${GITHUB_SHA}"; then
              echo "published tag is not an ancestor of the current release run: ${tag_name}" >&2
              exit 1
            fi
          }

          inspect_component specification openapi/generated v
          inspect_component sdk sdk/rust/crates/opendart opendart-v

          components="$(jq -cs 'if length <= 2 and ([.[].component] | unique | length) == length then . else error("ambiguous component recovery state") end' "${candidates}")"
          echo "components=${components}" >> "${GITHUB_OUTPUT}"

      - name: Run Release Please
        if: ${{ steps.recovery.outputs.components == '[]' }}
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize release proposal numbers
        id: proposals
        env:
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          if test -z "${RELEASE_PRS}"; then
            echo 'numbers=[]' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          numbers="$(jq -cer 'if type == "array" then [.[].number] else error("release PR output is not an array") end | if all(.[]; type == "number" and . > 0) then . else error("release PR number is invalid") end' <<<"${RELEASE_PRS}")"
          echo "numbers=${numbers}" >> "${GITHUB_OUTPUT}"

      - name: Normalize component release outputs
        id: component
        env:
          CLI_CREATED: ${{ steps.release.outputs['sdk/rust/crates/opendart-cli--release_created'] }}
          RECOVERY_COMPONENTS: ${{ steps.recovery.outputs.components }}
          SDK_CREATED: ${{ steps.release.outputs['sdk/rust/crates/opendart--release_created'] }}
          SDK_SHA: ${{ steps.release.outputs['sdk/rust/crates/opendart--sha'] }}
          SDK_TAG: ${{ steps.release.outputs['sdk/rust/crates/opendart--tag_name'] }}
          SDK_VERSION: ${{ steps.release.outputs['sdk/rust/crates/opendart--version'] }}
          SPEC_CREATED: ${{ steps.release.outputs['openapi/generated--release_created'] }}
          SPEC_SHA: ${{ steps.release.outputs['openapi/generated--sha'] }}
          SPEC_TAG: ${{ steps.release.outputs['openapi/generated--tag_name'] }}
          SPEC_VERSION: ${{ steps.release.outputs['openapi/generated--version'] }}
        run: |
          if test "${CLI_CREATED}" = true; then
            echo "CLI publication is not authorized" >&2
            exit 1
          fi
          spec_created=false
          sdk_created=false
          if test "${SPEC_CREATED}" = true; then
            spec_created=true
          fi
          if test "${SDK_CREATED}" = true; then
            sdk_created=true
          fi

          jq -e 'type == "array" and length <= 2 and ([.[].component] | unique | length) == length' <<<"${RECOVERY_COMPONENTS}" > /dev/null
          spec_recovery="$(jq -c '[.[] | select(.component == "specification")]' <<<"${RECOVERY_COMPONENTS}")"
          if test "$(jq 'length' <<<"${spec_recovery}")" = 1; then
            recovery="$(jq -c '.[0]' <<<"${spec_recovery}")"
            if test "$(jq -r .state <<<"${recovery}")" = draft; then
              spec_created=true
              SPEC_TAG="$(jq -r .tag <<<"${recovery}")"
              SPEC_VERSION="$(jq -r .version <<<"${recovery}")"
              SPEC_SHA="$(jq -r .sha <<<"${recovery}")"
            elif test "$(jq -r .state <<<"${recovery}")" != complete; then
              echo "unknown specification recovery state" >&2
              exit 1
            fi
          fi
          sdk_recovery="$(jq -c '[.[] | select(.component == "sdk")]' <<<"${RECOVERY_COMPONENTS}")"
          if test "$(jq 'length' <<<"${sdk_recovery}")" = 1; then
            recovery="$(jq -c '.[0]' <<<"${sdk_recovery}")"
            if test "$(jq -r .state <<<"${recovery}")" = draft; then
              sdk_created=true
              SDK_TAG="$(jq -r .tag <<<"${recovery}")"
              SDK_VERSION="$(jq -r .version <<<"${recovery}")"
              SDK_SHA="$(jq -r .sha <<<"${recovery}")"
            elif test "$(jq -r .state <<<"${recovery}")" != complete; then
              echo "unknown SDK recovery state" >&2
              exit 1
            fi
          fi

          if test "${spec_created}" = true; then
            grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"${SPEC_TAG}"
            test "${SPEC_TAG}" = "v${SPEC_VERSION}"
            grep -Eq '^[0-9a-f]{40}$' <<<"${SPEC_SHA}"
          fi
          sdk_prerelease=false
          if test "${sdk_created}" = true; then
            if grep -Eq '^0\.1\.0-beta\.[1-9][0-9]*$' <<<"${SDK_VERSION}"; then
              sdk_prerelease=true
            else
              test "${SDK_VERSION}" = 0.1.0
            fi
            test "${SDK_TAG}" = "opendart-v${SDK_VERSION}"
            grep -Eq '^[0-9a-f]{40}$' <<<"${SDK_SHA}"
          fi

          echo "spec_release_created=${spec_created}" >> "${GITHUB_OUTPUT}"
          echo "spec_tag_name=${SPEC_TAG}" >> "${GITHUB_OUTPUT}"
          echo "spec_version=${SPEC_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "spec_sha=${SPEC_SHA}" >> "${GITHUB_OUTPUT}"
          echo "sdk_release_created=${sdk_created}" >> "${GITHUB_OUTPUT}"
          echo "sdk_tag_name=${SDK_TAG}" >> "${GITHUB_OUTPUT}"
          echo "sdk_version=${SDK_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "sdk_sha=${SDK_SHA}" >> "${GITHUB_OUTPUT}"
          echo "sdk_prerelease=${sdk_prerelease}" >> "${GITHUB_OUTPUT}"

      - name: Check out specification release commit
        if: ${{ steps.component.outputs.spec_release_created == 'true' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ steps.component.outputs.spec_sha }}
          persist-credentials: false

      - name: Prepare specification release assets
        if: ${{ steps.component.outputs.spec_release_created == 'true' }}
        run: |
          mkdir release-assets
          cp openapi/generated/openapi.bundle.yaml release-assets/openapi.bundle.yaml
          cd release-assets
          sha256sum openapi.bundle.yaml > openapi.bundle.yaml.sha256

      - name: Upload specification release assets
        if: ${{ steps.component.outputs.spec_release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.component.outputs.spec_tag_name }}
        run: |
          for asset_path in \
            release-assets/openapi.bundle.yaml \
            release-assets/openapi.bundle.yaml.sha256
          do
            asset_name="${asset_path##*/}"
            if gh release view "${TAG_NAME}" --json assets --jq '.assets[].name' | grep -Fqx "${asset_name}"; then
              mkdir -p existing-assets
              gh release download "${TAG_NAME}" --pattern "${asset_name}" --dir existing-assets
              if ! cmp -s "${asset_path}" "existing-assets/${asset_name}"; then
                echo "existing release asset differs: ${asset_name}" >&2
                exit 1
              fi
            else
              gh release upload "${TAG_NAME}" "${asset_path}"
            fi
          done

      - name: Publish immutable specification release
        if: ${{ steps.component.outputs.spec_release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.component.outputs.spec_tag_name }}
        run: gh release edit "${TAG_NAME}" --draft=false --prerelease=false --latest

  dispatch-release-pr-checks:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs != '[]' }}
    permissions:
      actions: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      proposals: ${{ steps.dispatch.outputs.proposals }}
    steps:
      - name: Dispatch exact-SHA release proposal checks
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PRS: ${{ needs.release-please.outputs.prs }}
        run: |
          numbers="$(jq -er 'if type == "array" and length > 0 and all(.[]; type == "number" and . > 0) then .[] else error("release proposal numbers are invalid") end' <<<"${RELEASE_PRS}")"
          proposals='[]'
          while IFS= read -r number; do
            detail="$(gh pr view "${number}" --repo "${GITHUB_REPOSITORY}" --json author,baseRefName,headRefName,headRefOid,labels,state)"
            jq -e '
              .state == "OPEN" and
              .baseRefName == "main" and
              .author.login == "app/github-actions" and
              (.headRefName | startswith("release-please--branches--main")) and
              any(.labels[]; .name == "autorelease: pending") and
              (.headRefOid | test("^[0-9a-f]{40}$"))
            ' <<<"${detail}" > /dev/null
            branch="$(jq -r .headRefName <<<"${detail}")"
            sha="$(jq -r .headRefOid <<<"${detail}")"
            verify_after_id="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/verify.yml/runs" -f event=workflow_dispatch -f per_page=1 --jq '.workflow_runs[0].id // 0')"
            full_race_after_id="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/full-race.yml/runs" -f event=workflow_dispatch -f per_page=1 --jq '.workflow_runs[0].id // 0')"
            gh workflow run verify.yml --repo "${GITHUB_REPOSITORY}" --ref "${branch}" -f expected_sha="${sha}"
            gh workflow run full-race.yml --repo "${GITHUB_REPOSITORY}" --ref "${branch}" -f expected_sha="${sha}"
            proposals="$(jq -c \
              --argjson number "${number}" \
              --arg branch "${branch}" \
              --arg sha "${sha}" \
              --argjson verify_after_id "${verify_after_id}" \
              --argjson full_race_after_id "${full_race_after_id}" \
              '. + [{number: $number, branch: $branch, sha: $sha, verify_after_id: $verify_after_id, full_race_after_id: $full_race_after_id}]' \
              <<<"${proposals}")"
          done <<<"${numbers}"
          echo "proposals=${proposals}" >> "${GITHUB_OUTPUT}"

  report-release-pr-status:
    needs: dispatch-release-pr-checks
    if: ${{ needs.dispatch-release-pr-checks.outputs.proposals != '[]' }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        proposal: ${{ fromJSON(needs.dispatch-release-pr-checks.outputs.proposals) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Report exact-SHA release proposal status
        env:
          BASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROPOSAL: ${{ toJSON(matrix.proposal) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          find_run() {
            workflow="$1"
            sha="$2"
            after_id="$3"
            for _ in $(seq 1 240); do
              matches="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" -f event=workflow_dispatch -f per_page=100 | jq -c \
                --arg sha "${sha}" \
                --argjson after_id "${after_id}" '
                  [.workflow_runs[] |
                    select(
                      .id > $after_id and
                      .head_sha == $sha and
                      .event == "workflow_dispatch" and
                      .actor.login == "github-actions[bot]" and
                      .triggering_actor.login == "github-actions[bot]" and
                      .repository.full_name == env.GITHUB_REPOSITORY
                    )
                  ]
                ')" || return 1
              count="$(jq 'length' <<<"${matches}")" || return 1
              if test "${count}" -gt 1; then
                echo "multiple ${workflow} runs match ${sha}" >&2
                return 1
              fi
              if test "${count}" = 1 && test "$(jq -r '.[0].status' <<<"${matches}")" = completed; then
                jq -c '.[0]' <<<"${matches}"
                return
              fi
              sleep 10 || return 1
            done
            echo "timed out waiting for ${workflow} at ${sha}" >&2
            return 1
          }

          validate_proposal() {
            test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "${BASE_SHA}" || return 1
            detail="$(gh pr view "${number}" --repo "${GITHUB_REPOSITORY}" --json author,baseRefName,baseRefOid,headRefName,headRefOid,labels,state)" || return 1
            jq -e --arg base "${BASE_SHA}" --arg branch "${branch}" --arg sha "${sha}" '
              .state == "OPEN" and
              .baseRefName == "main" and
              .baseRefOid == $base and
              .headRefName == $branch and
              .headRefOid == $sha and
              .author.login == "app/github-actions" and
              any(.labels[]; .name == "autorelease: pending")
            ' <<<"${detail}" > /dev/null || return 1

            comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${sha}")" || return 1
            jq -e --arg base "${BASE_SHA}" '
              .status == "ahead" and
              .behind_by == 0 and
              .merge_base_commit.sha == $base
            ' <<<"${comparison}" > /dev/null || return 1

            case "${branch}" in
              release-please--branches--main--components--opendart-spec)
                expected='[
                  {"filename":".release-please-manifest.json","status":"modified"},
                  {"filename":"CHANGELOG.md","status":"modified"}
                ]'
                ;;
              release-please--branches--main--components--opendart)
                expected='[
                  {"filename":".release-please-manifest.json","status":"modified"},
                  {"filename":"sdk/rust/Cargo.lock","status":"modified"},
                  {"filename":"sdk/rust/compat/reqwest-feature-unification/Cargo.lock","status":"modified"},
                  {"filename":"sdk/rust/crates/opendart-cli/Cargo.toml","status":"modified"},
                  {"filename":"sdk/rust/crates/opendart/CHANGELOG.md","status":"modified"},
                  {"filename":"sdk/rust/crates/opendart/Cargo.toml","status":"modified"}
                ]'
                ;;
              *) echo "unsupported Release Please branch: ${branch}" >&2; return 1 ;;
            esac
            jq -e --argjson expected "${expected}" '
              [.files[] | {filename, status}] | sort_by(.filename) == $expected
            ' <<<"${comparison}" > /dev/null
          }

          proposal="$(jq -cer '
            if type == "object" and
              (.number | type == "number" and . > 0) and
              (.branch | type == "string" and length > 0) and
              (.sha | type == "string" and test("^[0-9a-f]{40}$")) and
              (.verify_after_id | type == "number" and . >= 0) and
              (.full_race_after_id | type == "number" and . >= 0)
            then . else error("release proposal is invalid") end
          ' <<<"${PROPOSAL}")"
          number="$(jq -r .number <<<"${proposal}")"
          branch="$(jq -r .branch <<<"${proposal}")"
          sha="$(jq -r .sha <<<"${proposal}")"
          verify_after_id="$(jq -r .verify_after_id <<<"${proposal}")"
          full_race_after_id="$(jq -r .full_race_after_id <<<"${proposal}")"

          report_status() {
            state="$1"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
              -f state="${state}" \
              -f context=verify \
              -f description="Exact-SHA release proposal gates ${state}" \
              -f target_url="${RUN_URL}" > /dev/null
          }
          fail_proposal() {
            report_status failure || true
            exit 1
          }

          validate_proposal || fail_proposal
          verify_run="$(find_run verify.yml "${sha}" "${verify_after_id}")" || fail_proposal
          full_race_run="$(find_run full-race.yml "${sha}" "${full_race_after_id}")" || fail_proposal
          validate_proposal || fail_proposal
          verify_conclusion="$(jq -r .conclusion <<<"${verify_run}")"
          full_race_conclusion="$(jq -r .conclusion <<<"${full_race_run}")"
          if test "${verify_conclusion}" = success && test "${full_race_conclusion}" = success; then
            report_status success
          else
            report_status failure
            exit 1
          fi

  sdk-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.sdk_release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/rust-crate-release.yml
    with:
      package: opendart
      package_path: sdk/rust/crates/opendart
      inventory_path: sdk/rust/package-files.txt
      vcs_path: sdk/rust/crates/opendart
      expected_owner: ${{ vars.OPENDART_CRATES_IO_OWNER }}
      version: ${{ needs.release-please.outputs.sdk_version }}
      tag_name: ${{ needs.release-please.outputs.sdk_tag_name }}
      candidate_sha: ${{ needs.release-please.outputs.sdk_sha }}
      prerelease: ${{ needs.release-please.outputs.sdk_prerelease == 'true' }}
