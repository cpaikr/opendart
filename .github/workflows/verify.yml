name: Verify

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run required Go verification
        run: ./scripts/verify go

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run required Rust verification
        run: ./scripts/verify rust

  artifact-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Fetch locked Rust dependencies
        run: cargo +1.97.1 fetch --locked --manifest-path sdk/rust/Cargo.toml

      - name: Verify native binary artifact behavior
        run: |
          cargo +1.97.1 test --locked --offline --manifest-path sdk/rust/Cargo.toml -p opendart-cli --bin opendart
          cargo +1.97.1 test --locked --offline --manifest-path sdk/rust/Cargo.toml -p opendart-cli --test binary_loopback
        env:
          RUSTFLAGS: --cfg opendart_compat

      - name: Install CLI from reviewed source offline
        run: |
          install_workspace="$(mktemp -d)"
          CARGO_TARGET_DIR="${install_workspace}/target" cargo +1.97.1 install --locked --offline --path sdk/rust/crates/opendart-cli --root "${install_workspace}/root"
          "${install_workspace}/root/bin/opendart" --version
          "${install_workspace}/root/bin/opendart" operations list > /dev/null

  artifact-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Fetch locked Rust dependencies
        run: cargo +1.97.1 fetch --locked --manifest-path sdk/rust/Cargo.toml

      - name: Verify native binary artifact behavior
        run: |
          cargo +1.97.1 test --locked --offline --manifest-path sdk/rust/Cargo.toml -p opendart-cli --bin opendart
          cargo +1.97.1 test --locked --offline --manifest-path sdk/rust/Cargo.toml -p opendart-cli --test binary_loopback
        env:
          RUSTFLAGS: --cfg opendart_compat

      - name: Install CLI from reviewed source offline
        run: |
          $installWorkspace = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          $installRoot = Join-Path $installWorkspace "root"
          $env:CARGO_TARGET_DIR = Join-Path $installWorkspace "target"
          cargo +1.97.1 install --locked --offline --path sdk/rust/crates/opendart-cli --root $installRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = Join-Path $installRoot "bin/opendart.exe"
          & $binary --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $binary operations list | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:HOME -ErrorAction SilentlyContinue
          $env:USERPROFILE = $installRoot
          $homeDocument = & $binary | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $homeDocument.executable.display.StartsWith("~")) { exit 1 }

  verify:
    if: ${{ always() }}
    needs:
      - go
      - rust
      - artifact-macos
      - artifact-windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful verification jobs
        env:
          GO_RESULT: ${{ needs.go.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          MACOS_RESULT: ${{ needs.artifact-macos.result }}
          WINDOWS_RESULT: ${{ needs.artifact-windows.result }}
        run: |
          failed=0
          for result in \
            "go=${GO_RESULT}" \
            "rust=${RUST_RESULT}" \
            "artifact-macos=${MACOS_RESULT}" \
            "artifact-windows=${WINDOWS_RESULT}"
          do
            case "${result}" in
              *=success) ;;
              *)
                echo "${result}" >&2
                failed=1
                ;;
            esac
          done
          exit "${failed}"
