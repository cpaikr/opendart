name: Full race verification

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full Release Please PR head revision
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: full-race-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_sha || github.sha }}

      - name: Attest checked-out revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: |
          test "${GITHUB_SHA}" = "${EXPECTED_SHA}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run full Go race sweep
        run: ./scripts/verify full-race
